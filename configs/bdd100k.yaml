# BDD100K 联合检测配置

data:
  name: "bdd100k"
  data_root: "./data/bdd100k/"
  image_size: [360, 640]
  num_frames: 5
  frame_interval: 1
  augment: true

model:
  backbone: "resnet34"           # BDD100K 场景更复杂，用稍大的 backbone
  pretrained: true

  temporal:
    num_frames: 5
    hidden_channels: 128
    use_attention: true
    attention_reduction: 4

  lane_head:
    num_anchors: 72
    anchor_angles: [-72, 72]
    num_regression_parameters: 4
    classifier_hidden: 64

  drivable_head:
    num_classes: 3
    decoder_channels: [256, 128, 64]

train:
  batch_size: 6                  # 更大的 backbone → 更小的 batch
  epochs: 100
  learning_rate: 0.0008
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  warmup_epochs: 5

  loss:
    lane_cls_weight: 1.5
    lane_reg_weight: 1.0
    drivable_weight: 1.0

eval:
  metrics: ["f1", "precision", "recall", "miou"]
  lane_iou_threshold: 0.5
